events { 
    worker_connections 1024; 
}

http {
    include /etc/nginx/mime.types;
    sendfile on;
    resolver 127.0.0.11 valid=10s;

    # HTTP to HTTPS Redirect
    server {
        listen 80;
        server_name fhir.sandbox.local;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Main HTTPS Server
    server {
        listen 443 ssl;
        server_name fhir.sandbox.local;

        ssl_certificate     /etc/nginx/certs/sandbox.crt;
        ssl_certificate_key /etc/nginx/certs/sandbox.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # oauth2-proxy auth check endpoint (used by auth_request)
        location = /oauth2/auth {
            internal;
            proxy_pass http://oauth2-proxy:4180/oauth2/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Content-Length "";
            proxy_pass_request_body off;
        }

        # If auth_request returns 401, redirect to oauth2-proxy login flow
        location @oauth2_signin {
            return 302 /fhir/oauth2/start?rd=$scheme://$host$request_uri;
        }

        # Enforce Keycloak login before launching SMART apps
        location = /launcher {
            auth_request /oauth2/auth;
            error_page 401 = @oauth2_signin;

            proxy_pass http://smart-launcher:80/launcher;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location = /remote-launch {
            auth_request /oauth2/auth;
            error_page 401 = @oauth2_signin;

            proxy_pass http://smart-launcher:80/remote-launch;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # SMART Launcher UI
        location / {
            proxy_pass http://smart-launcher:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Bypass CSP restrictions for local development
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data:; connect-src 'self' https://$host https://*.smarthealthit.org https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src-elem 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: https:; frame-ancestors 'self';";
        }

        # Protected FHIR API via OAuth2 Proxy
        location /hapi-fhir-jpaserver/ {
            return 302 /fhir$uri$is_args$args;
        }
        location /v/r4/ {
            proxy_pass http://smart-launcher:80;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /fhir/ {
            proxy_pass http://oauth2-proxy:4180/; 
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
        }


        # Keycloak Authentication
        location /realms/ {
            proxy_pass http://keycloak:8180/realms/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location /resources/ {
            proxy_pass http://keycloak:8180/resources/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Patient Browser Configuration
        location /browser/ {
            proxy_pass http://patient-browser:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

events { 
    worker_connections 1024; 
}

http {
    include           /etc/nginx/mime.types;
    sendfile          on;
    resolver          127.0.0.11 valid=10s; # Docker DNS

    server {
        listen 80;
        server_name smartonfhir.sandbox.local;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name smartonfhir.sandbox.local;

        ssl_certificate     /etc/nginx/certs/sandbox.crt;
        ssl_certificate_key /etc/nginx/certs/sandbox.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /realms/ {
            proxy_pass http://keycloak:8180/realms/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location /admin/ {
            proxy_pass http://keycloak:8180/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
        }

        location /resources/ {
            proxy_pass http://keycloak:8180/resources/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        location / {
            proxy_pass http://smart-launcher:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data:; connect-src 'self' https://$host https://*.smarthealthit.org https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src-elem 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: https:; frame-ancestors 'self';";
        }


        location /fhir/ {
            proxy_pass http://r4:8080/; 
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;

            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Keep-Alive, User-Agent, X-Requested-With, X-FHIR-Starter" always;
            add_header Access-Control-Expose-Headers "Content-Location, Location" always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Keep-Alive, User-Agent, X-Requested-With, X-FHIR-Starter" always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 204;
            }
        }

        location /hapi-fhir-jpaserver/ {
            return 302 /fhir$uri$is_args$args;
        }

        location /browser/ {
            proxy_pass http://patient-browser:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

# nginx.conf
events { 
    worker_connections 1024; 
}

http {
    include /etc/nginx/mime.types;
    sendfile on;
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name 192.168.0.5;

        if ($host = localhost) {
            return 302 http://192.168.0.5$request_uri;
        }

        if ($host = 127.0.0.1) {
            return 302 http://192.168.0.5$request_uri;
        }

        location /info/ {
            alias /usr/share/nginx/html/;
            index index.html;
        }

        # oauth2-proxy may redirect to /hapi-fhir-jpaserver/... (without /fhir prefix)
        # after callback; normalize it to the routed /fhir/... path.
        location /hapi-fhir-jpaserver/ {
            return 302 /fhir$uri$is_args$args;
        }

        location / {
            proxy_pass http://smart-launcher:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /static/ { 
            proxy_pass http://smart-launcher:80/static/; 
        }
        location /vendor/ { 
            proxy_pass http://smart-launcher:80/vendor/; 
        }
        location /env.js  { 
            proxy_pass http://smart-launcher:80/env.js; 
        }
        location /logo.png { 
            proxy_pass http://smart-launcher:80/logo.png; 
        }
        location /launcher { 
            proxy_pass http://smart-launcher:80/launcher; 
        }


        location /fhir/ {
            proxy_pass http://oauth2-proxy:4180/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Uri $request_uri;
        }

        location /realms/ {
            proxy_pass http://keycloak:8180/realms/;
            proxy_set_header Host $host;
        }

        location /resources/ {
            proxy_pass http://keycloak:8180/resources/;
            proxy_set_header Host $host;
        }

        location /browser/ {
            proxy_pass http://patient-browser:80/;
            proxy_set_header Host $host;
        }

        
    }
}
